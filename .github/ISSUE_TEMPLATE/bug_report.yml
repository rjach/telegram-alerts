name: Bug report
description: Something does not work as documented
labels: [bug, triage]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node version, framework, and host (e.g. Node 22, Next.js 16, Vercel)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the `SendResult` you got back, and the logged line if any. Never paste your bot token.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest snippet that shows the problem.
      render: ts
