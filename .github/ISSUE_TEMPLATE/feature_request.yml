name: Feature request
description: Propose an addition or change
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the package makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the call or option you would want.
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
