# Publishes to npm when a GitHub release is published. Needs an NPM_TOKEN repo secret
# (npm -> Access Tokens -> Granular, publish scope on @rojan-labs). Manual
# `npm publish` from a logged-in machine works too; prepublishOnly runs the same checks.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
